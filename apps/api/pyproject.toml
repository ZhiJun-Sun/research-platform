[project]
name = "hydrolab-api"
version = "0.1.0"
description = "HydroLab 水文时序实验平台后端 API"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "pydantic>=2.7,<3.0",
    "pydantic-settings>=2.3,<3.0",
    "email-validator>=2.3.0",
    # 论文级结果图渲染（服务端使用 Agg 无界面后端）
    "matplotlib>=3.9,<4.0",
    # 真实数据库接入：SQLAlchemy ORM + asyncmy 异步驱动 + Alembic 迁移
    "sqlalchemy>=2.0,<3.0",
    "asyncmy>=0.2,<1.0",
    "pymysql>=1.1,<2.0",
    "greenlet>=3,<4",
    "alembic>=1.13,<2.0",
]

# 真实 Adapter 的可选依赖组：仅启用对应 backend 时安装，核心包保持轻量（plans/05 独立依赖组）。
[project.optional-dependencies]
s3 = ["aiobotocore>=2.12,<3.0", "boto3>=1.34,<2.0"]
celery = ["celery>=5.4,<6.0", "redis>=5.0,<6.0"]
mlflow = ["mlflow>=2.15,<3.0"]
docker = ["docker>=7.1,<8.0"]

[dependency-groups]
dev = [
    "pytest>=8.2,<9.0",
    "pytest-asyncio>=0.23,<1.0",
    "httpx>=0.27,<1.0",
    "ruff>=0.6,<1.0",
    "mypy>=1.10,<2.0",
    "asgi-lifespan>=2.1.0",
    # 真实 Adapter 契约测试：S3 用 moto，Celery 用 fakeredis
    "moto[s3]>=5.0,<6.0",
    "fakeredis>=2.23,<3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hydrolab"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "RUF"]
ignore = [
    "RUF001",  # 中文字符串中的全角字符（本项目文案为中文）
    "RUF002",
    "RUF003",
    "B008",    # FastAPI Depends() 标准用法
]

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
strict = true
plugins = ["pydantic.mypy"]
