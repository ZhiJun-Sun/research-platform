services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: hydrolab
      POSTGRES_USER: hydrolab
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env.production}
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hydrolab -d hydrolab"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes: [redis-data:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set in .env.production}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set in .env.production}
    volumes: [minio-data:/data]
    ports: ["127.0.0.1:9001:9001"]
    restart: unless-stopped

  mlflow:
    image: ghcr.io/mlflow/mlflow:v3.0.1
    command: mlflow server --host 0.0.0.0 --port 5000 --backend-store-uri postgresql://hydrolab:${POSTGRES_PASSWORD}@postgres/hydrolab --default-artifact-root /mlartifacts
    depends_on:
      postgres: { condition: service_healthy }
    volumes: [mlflow-data:/mlartifacts]
    restart: unless-stopped

  api:
    build: ../apps/api
    command: uv run uvicorn hydrolab.main:app --host 0.0.0.0 --port 8000
    env_file: .env.production
    environment:
      HYDROLAB_ENVIRONMENT: production
      HYDROLAB_PUBLIC_BASE_URL: https://hydrolab.example.com
      HYDROLAB_CORS_ORIGINS: '["https://hydrolab.example.com"]'
      HYDROLAB_DATABASE_URL: postgresql+asyncpg://hydrolab:${POSTGRES_PASSWORD}@postgres:5432/hydrolab
      HYDROLAB_REDIS_URL: redis://redis:6379/0
      HYDROLAB_MLFLOW_TRACKING_URI: http://mlflow:5000
      HYDROLAB_S3_ENDPOINT: http://minio:9000
      HYDROLAB_S3_ADDRESSING_STYLE: path
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    restart: unless-stopped

  web:
    build: ../apps/web
    ports: ["127.0.0.1:8080:80"]
    depends_on: [api]
    restart: unless-stopped

  # 真实 Docker GPU Runner 的预留服务。保持 profile，直到 RUNNER 安全 Spike 和 Adapter 已验收。
  runner:
    image: hydrolab-runner:pending-adapter-spike
    profiles: [gpu]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: "no"

volumes:
  postgres-data:
  redis-data:
  minio-data:
  mlflow-data:
