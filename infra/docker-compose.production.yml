# HydroLab 生产编排。
# 说明：
#  - 顶部固定 Compose 项目名：容器/网络/卷一律带 hydrolab- 前缀，与宿主机上其他项目完全隔离。
#  - 生产默认显式启用真实后端（MySQL/Redis/MinIO/MLflow）；对应凭证由 .env.production 提供。
#  - 每个服务声明健康检查与依赖；Worker 独立于 API，避免任务重复执行。
#  - GPU 训练由独立 Worker 承担，API 不挂载 Docker socket。
#    不再提供指向占位镜像的 runner 服务。启用 GPU 需宿主机有 nvidia driver + docker gpu runtime。
name: hydrolab
services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set in .env.production}
      MYSQL_DATABASE: hydrolab
      MYSQL_USER: hydrolab
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set in .env.production}
      TZ: UTC
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes: [mysql-data:/var/lib/mysql]
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$$MYSQL_USER -p$$MYSQL_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes: [redis-data:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set in .env.production}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set in .env.production}
    volumes: [minio-data:/data]
    ports: ["${HYDROLAB_MINIO_CONSOLE_BIND:-127.0.0.1}:${HYDROLAB_MINIO_CONSOLE_PORT:-9001}:9001"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  mlflow:
    image: ghcr.io/mlflow/mlflow:v3.0.1
    command: mlflow server --host 0.0.0.0 --port 5000 --backend-store-uri mysql+pymysql://hydrolab:${MYSQL_PASSWORD}@mysql:3306/hydrolab --default-artifact-root /mlartifacts
    depends_on:
      mysql: { condition: service_healthy }
    volumes: [mlflow-data:/mlartifacts]
    restart: unless-stopped

  api:
    build:
      context: ../apps/api
      dockerfile: Dockerfile
    command: uvicorn hydrolab.main:app --host 0.0.0.0 --port 8000
    env_file: ${HYDROLAB_ENV_FILE:-.env.production}
    environment:
      HYDROLAB_ENVIRONMENT: production
      # 对外访问地址与跨域白名单由 .env.production 提供（影响分享链接生成；同源部署 CORS 可留空）
      HYDROLAB_PUBLIC_BASE_URL: ${HYDROLAB_PUBLIC_BASE_URL:-http://127.0.0.1:8080}
      HYDROLAB_CORS_ORIGINS: '${HYDROLAB_CORS_ORIGINS:-[]}'
      HYDROLAB_DATABASE_BACKEND: mysql
      HYDROLAB_DATABASE_URL: mysql+asyncmy://hydrolab:${MYSQL_PASSWORD}@mysql:3306/hydrolab?charset=utf8mb4
      HYDROLAB_REDIS_URL: redis://redis:6379/0
      HYDROLAB_MLFLOW_TRACKING_URI: http://mlflow:5000
      HYDROLAB_S3_ENDPOINT: http://minio:9000
      HYDROLAB_S3_ADDRESSING_STYLE: path
      HYDROLAB_S3_BUCKET: ${HYDROLAB_S3_BUCKET:-hydrolab}
      HYDROLAB_S3_ACCESS_KEY: ${MINIO_ROOT_USER:?set in .env.production}
      HYDROLAB_S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?set in .env.production}
    depends_on:
      mysql: { condition: service_healthy }
      redis: { condition: service_healthy }
      minio: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,os; urllib.request.urlopen('http://127.0.0.1:8000/health/live')"]
      interval: 15s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  worker:
    build: &worker-build
      context: ../apps
      dockerfile: worker/Dockerfile
    command: celery -A hydrolab_worker.tasks:celery_app worker --loglevel=info --concurrency=2 -Q hydrolab
    env_file: ${HYDROLAB_ENV_FILE:-.env.production}
    environment: &worker-environment
      HYDROLAB_ENVIRONMENT: production
      HYDROLAB_DATABASE_BACKEND: mysql
      HYDROLAB_DATABASE_URL: mysql+asyncmy://hydrolab:${MYSQL_PASSWORD}@mysql:3306/hydrolab?charset=utf8mb4
      HYDROLAB_REDIS_URL: redis://redis:6379/0
      HYDROLAB_RUN_EXECUTOR_BACKEND: docker
      HYDROLAB_TASK_QUEUE_BACKEND: celery
      HYDROLAB_S3_ENDPOINT: http://minio:9000
      HYDROLAB_S3_ACCESS_KEY: ${MINIO_ROOT_USER:?set in .env.production}
      HYDROLAB_S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?set in .env.production}
      HYDROLAB_MLFLOW_TRACKING_URI: http://mlflow:5000
      HYDROLAB_RUNNER_WORKSPACE_ROOT: ${HYDROLAB_RUNNER_WORKSPACE_ROOT:-/srv/hydrolab/runs}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # Same absolute path inside Worker and on Docker host is required for bind mounts.
      - ${HYDROLAB_RUNNER_WORKSPACE_ROOT:-/srv/hydrolab/runs}:${HYDROLAB_RUNNER_WORKSPACE_ROOT:-/srv/hydrolab/runs}
    depends_on:
      mysql: { condition: service_healthy }
      redis: { condition: service_healthy }
      api: { condition: service_healthy }
    restart: unless-stopped

  worker-control:
    build: *worker-build
    command: celery -A hydrolab_worker.tasks:celery_app worker --loglevel=info --concurrency=1 -Q hydrolab-control
    env_file: ${HYDROLAB_ENV_FILE:-.env.production}
    environment: *worker-environment
    depends_on:
      redis: { condition: service_healthy }
    restart: unless-stopped

  web:
    build:
      context: ../apps/web
      args:
        # 默认走 npmmirror（国内构建稳定）；其他网络环境在 .env.production 覆盖为官方源
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmmirror.com}
    ports: ["${HYDROLAB_WEB_BIND:-127.0.0.1}:${HYDROLAB_WEB_PORT:-8080}:80"]
    depends_on: [api]
    restart: unless-stopped

volumes:
  mysql-data:
  redis-data:
  minio-data:
  mlflow-data:
